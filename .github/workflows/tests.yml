name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (audio + OpenCV)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: much smaller than the default CUDA build. torch and
          # torchvision must come from the same index together, otherwise
          # ultralytics pulls a PyPI torchvision built for a different torch
          # ("operator torchvision::nms does not exist").
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -c "import torch, torchvision, torchvision.ops; print('torch', torch.__version__, 'torchvision', torchvision.__version__)"

      - name: Run unit tests
        run: python -m pytest
